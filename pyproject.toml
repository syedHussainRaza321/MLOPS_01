[project]
name = "vehicle-detection-ml-collab"
version = "0.1.0"
description = "Top-view vehicle detection with YOLOv8 (Assignment01)"
authors = [
    { name = "Hussain Raza" },
    { name = "Amir Ali", email = "amiraliasif09@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.4.170",
    "opencv-python>=4.9.0",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "pandas",
    "seaborn",
    "pillow",
    "dvc>=3.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]